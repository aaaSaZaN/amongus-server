services:
  photon:
    build: .
    # Host networking: Photon is plain UDP and clients must reach the exact
    # address the server hands out in its replies.
    network_mode: host
    env_file: .env
    command: ["--public", "${PUBLIC_ADDRESS:?set PUBLIC_ADDRESS in .env}", "--dashboard", "${DASHBOARD:-127.0.0.1:8080}"]
    restart: unless-stopped
